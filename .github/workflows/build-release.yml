name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build exe with PyInstaller
        run: |
          pyinstaller OI-Learn.spec

      - name: Verify build output
        shell: pwsh
        run: |
          if (Test-Path "dist\OI-Learn\OI-Learn.exe") {
            Write-Host "Build successful!"
          } else {
            Write-Host "ERROR: OI-Learn.exe not found"
            Get-ChildItem "dist\" -Recurse -Depth 1
            exit 1
          }

      - name: Package as ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\OI-Learn\*" -DestinationPath "OI-Learn-Windows.zip"

      - name: Upload to Release (tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: OI-Learn-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: OI-Learn-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: OI-Learn-Windows
          path: OI-Learn-Windows.zip
          retention-days: 30
